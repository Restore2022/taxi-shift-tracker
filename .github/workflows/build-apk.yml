name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync web assets
        run: |
          mkdir -p app/src/main/assets/css app/src/main/assets/js
          cp ../index.html app/src/main/assets/index.html
          cp ../css/styles.css app/src/main/assets/css/styles.css
          cp ../js/*.js app/src/main/assets/js/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build release APK
        run: gradle assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TaxiSmena.apk
          ls -la dist/TaxiSmena.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaxiSmena-apk
          path: android/dist/TaxiSmena.apk
